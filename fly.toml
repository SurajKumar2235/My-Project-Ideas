# fly.toml app configuration file generated for project-manager-bot
app = "my-project-ideas"
primary_region = "bom"

[processes]
  web = "uv run uvicorn api.main:app --host 0.0.0.0 --port 8000"
  bot = "uv run python bot/main.py"

[http_service]
  processes = ["web"]
  auto_start_machines = true
  auto_stop_machines = false
  force_https = true
  internal_port = 8000
  max_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256