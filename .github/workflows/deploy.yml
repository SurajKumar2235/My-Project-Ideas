name: Build & Deploy to AWS ECR

on:
  push:
    branches:
      - feature_test
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'project-manager-bot' }}

jobs:
  build-and-push:
    name: Build & Push Docker Image to Amazon ECR
    runs-on: ubuntu-latest
    env:
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      ECS_WEB_SERVICE: ${{ secrets.ECS_WEB_SERVICE }}
      ECS_BOT_SERVICE: ${{ secrets.ECS_BOT_SERVICE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image for linux/amd64..."
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

          echo "Pushing image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "Pushed successfully:"
          echo "  - $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "  - $ECR_REGISTRY/$ECR_REPOSITORY:latest"

      # Optional: Trigger Amazon ECS Service Deployment if ECS env variables are populated
      - name: Deploy to Amazon ECS Web Service
        if: env.ECS_CLUSTER != '' && env.ECS_WEB_SERVICE != ''
        run: |
          echo "Updating Amazon ECS Web Service: $ECS_WEB_SERVICE in cluster $ECS_CLUSTER..."
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_WEB_SERVICE" \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Deploy to Amazon ECS Bot Service
        if: env.ECS_CLUSTER != '' && env.ECS_BOT_SERVICE != ''
        run: |
          echo "Updating Amazon ECS Bot Service: $ECS_BOT_SERVICE in cluster $ECS_CLUSTER..."
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_BOT_SERVICE" \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
