[project]
name = "project-manager-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.1"
dependencies = [
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.9",
    "pydantic[email]>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.8",
    "requests>=2.34.2",
    "uvicorn>=0.30.0",
    "pyjwt>=2.8.0",
    "tortoise-orm>=0.24.0",
    "asyncpg>=0.30.0",
    "aerich>=0.8.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]



[tool.tortoise]

tortoise_orm = "core.db_config.TORTOISE_ORM"

location = "./migrations"

src_folder = "./."

